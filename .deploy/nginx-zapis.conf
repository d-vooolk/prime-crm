# Поддомен страниц записи для клиента: https://zapis.prime-auto.by/<код записи>
# Положить в /etc/nginx/sites-available/zapis.prime-auto.by, симлинк в sites-enabled,
# сертификат: certbot --nginx -d zapis.prime-auto.by
# 3005 — порт контейнера server из docker-compose.override.yml на сервере.
server {
    listen 80;
    server_name zapis.prime-auto.by;

    # Остальной API CRM на этом домене не нужен — только картинки страницы
    location /api/cars/photo/ {
        proxy_pass http://127.0.0.1:3005;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/uploads/repair-types/ {
        proxy_pass http://127.0.0.1:3005;
        proxy_set_header Host $host;
    }

    location /api/ {
        return 404;
    }

    location = / {
        return 301 https://prime-auto.by;
    }

    # /<код> → /zapis/<код> на сервере CRM
    location / {
        proxy_pass http://127.0.0.1:3005/zapis/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

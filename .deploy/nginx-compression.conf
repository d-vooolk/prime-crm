# Общий для всех сайтов сервера: /etc/nginx/conf.d/compression.conf
# (уровень http, нужен модуль libnginx-mod-http-brotli-filter). Приложениям за
# nginx передаётся пустой Accept-Encoding (proxy_set_header Accept-Encoding "";),
# чтобы сжимал nginx, а не они.

# Сжатие для всех сайтов. Раньше gzip был включён только для HTML: JS и CSS
# CRM и prime-auto уходили несжатыми (основной файл CRM — 1 МБ). Brotli
# сжимает текст на 15–20% лучше gzip; gzip остаётся для старых клиентов.
# У vdf.by свои значения на уровне server — они главнее этих.
gzip_vary on;
gzip_proxied any;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_types text/plain text/css text/xml text/javascript application/javascript
           application/json application/manifest+json application/xml
           application/rss+xml application/x-ndjson image/svg+xml image/x-icon
           text/x-component;

brotli on;
brotli_comp_level 5;
brotli_min_length 1024;
brotli_types text/plain text/css text/xml text/javascript application/javascript
             application/json application/manifest+json application/xml
             application/rss+xml application/x-ndjson image/svg+xml image/x-icon
             text/x-component;

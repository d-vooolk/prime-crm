services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: prime_crm
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d prime_crm"]
      interval: 5s
      timeout: 5s
      retries: 10

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/prime_crm
      PORT: 3001
      NODE_ENV: production
      CLIENT_URL: http://localhost:3000
      TZ: Europe/Minsk
      JWT_SECRET: prime-crm-jwt-secret-change-in-production
      MASTER_EMAIL: admin@prime-auto.by
      MASTER_PASSWORD: 82ehedub
    depends_on:
      postgres:
        condition: service_healthy

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - server

volumes:
  postgres_data:
